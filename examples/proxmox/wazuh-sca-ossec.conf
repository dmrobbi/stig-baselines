<!-- Wazuh SCA configuration for the "proxmox" agent group (thing1 manager).
     Snippet only — merge into the group's agent.conf (agent groups support
     <sca> distribution) or per-agent ossec.conf on the pilot node. The
     custom policy ships in the same group dir:
       /var/ossec/etc/shared/proxmox/sca_pve_stig_policy.yml
     Full wiring: docs/proxmox/wazuh-sca-integration.md. Test T8 in
     docs/proxmox/PILOT-TEST-PLAN.md. -->

<sca>
  <enabled>yes</enabled>
  <scan_on_start>yes</scan_on_start>
  <interval>24h</interval>
  <skip_nfs>yes</skip_nfs>

  <policies>
    <policy>sca_pve_stig_policy.yml</policy>
    <!-- optionally also the CIS Debian baseline shipped with Wazuh:
    <policy>cis_debian_linux.yml</policy>
    -->
  </policies>
</sca>